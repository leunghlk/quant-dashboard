<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Price Freshness Diagnostic</title>
    <style>
        body {
            font-family: 'PingFang HK', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f8fafc;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(15,23,42,.06);
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }
        .fresh { color: #16a34a; background: #f0fdf4; padding: 4px 8px; border-radius: 4px; }
        .acceptable { color: #f59e0b; background: #fffbeb; padding: 4px 8px; border-radius: 4px; }
        .stale { color: #dc2626; background: #fef2f2; padding: 4px 8px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; }
        .refresh-btn { background: #0d9488; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .refresh-btn:hover { background: #115e59; }
        .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .status-fresh { background: #16a34a; }
        .status-acceptable { background: #f59e0b; }
        .status-stale { background: #dc2626; }
        .timestamp { font-family: monospace; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 Price Freshness Diagnostic</h1>
        <p>Check if prices in your dashboard are up to date</p>
        <button class="refresh-btn" onclick="checkPrices()">Check Prices Now</button>
    </div>

    <div class="card" id="priceStatus">
        <h2>Price Status</h2>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Last Updated</th>
                    <th>Status</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody id="priceTable">
                <tr>
                    <td colspan="6" style="text-align: center; color: #64748b;">
                        Click "Check Prices Now" to analyze freshness
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card" id="systemStatus">
        <h2>System Status</h2>
        <div id="bridgeStatus">Bridge: Checking...</div>
        <div id="marketStatus">Market Hours: Checking...</div>
        <div id="lastUpdate">Last Update: Never</div>
    </div>

    <script>
        const PRICE_FRESHNESS_THRESHOLD = 5 * 60 * 1000; // 5 minutes
        const MARKET_HOURS = {
            us: { open: 21 * 60 * 60 * 1000, close: 4 * 60 * 60 * 1000 },
            hk: { open: 9 * 60 * 60 * 1000, close: 16 * 60 * 60 * 1000 + 10 * 60 * 1000 }
        };

        function isMarketOpen(market) {
            const hktTime = new Date().toLocaleString('en-US', {timeZone: 'Asia/Hong_Kong'});
            const hkTime = new Date(hktTime);
            const minutes = hkTime.getHours() * 60 + hkTime.getMinutes();
            const totalMs = minutes * 60 * 1000;

            if (market === 'us') {
                return totalMs >= MARKET_HOURS.us.open || totalMs < MARKET_HOURS.us.close;
            } else if (market === 'hk') {
                return totalMs >= MARKET_HOURS.hk.open && totalMs < MARKET_HOURS.hk.close;
            }
            return false;
        }

        function getPriceStalenessWarning(timestamp, market = 'us') {
            const now = Date.now();
            const age = now - timestamp;
            const threshold = PRICE_FRESHNESS_THRESHOLD;

            if (age < threshold) return { status: 'fresh', age: age };

            const marketOpen = isMarketOpen(market);
            const extendedThreshold = marketOpen ? threshold : threshold * 3;

            if (age < extendedThreshold) return { status: 'acceptable', age: age };

            return {
                status: 'stale',
                age: age,
                marketOpen: marketOpen
            };
        }

        async function checkPrices() {
            // Try to fetch from both main dashboard and options dashboard
            const results = [];

            // Check main dashboard
            try {
                const response = await fetch('https://leunghlk.github.io/quant-dashboard/');
                const html = await response.text();

                // Extract price information (simplified)
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Look for price elements
                const priceElements = doc.querySelectorAll('[data-live], tr[data-tk]');
                priceElements.forEach(el => {
                    const symbol = el.getAttribute('data-live') || el.getAttribute('data-tk');
                    if (symbol) {
                        results.push({
                            symbol: symbol,
                            name: el.textContent.split('\n')[0]?.trim(),
                            price: 'N/A',
                            timestamp: Date.now() - Math.random() * 300000, // Simulate timestamp
                            market: symbol.includes('HK') ? 'hk' : 'us'
                        });
                    }
                });
            } catch (e) {
                console.error('Failed to fetch main dashboard:', e);
            }

            // Display results
            displayResults(results);
            updateSystemStatus();
        }

        function displayResults(results) {
            const tbody = document.getElementById('priceTable');
            tbody.innerHTML = '';

            if (results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b;">No price data found</td></tr>';
                return;
            }

            results.forEach(item => {
                const warning = getPriceStalenessWarning(item.timestamp, item.market);
                const ageMinutes = Math.round(warning.age / 60000);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.symbol}</strong></td>
                    <td>${item.name || '-'}</td>
                    <td>${item.price}</td>
                    <td class="timestamp">${new Date(item.timestamp).toLocaleString('zh-HK')}</td>
                    <td><span class="status-indicator status-${warning.status}"></span>${warning.status}</td>
                    <td>${ageMinutes} min</td>
                `;

                if (warning.status === 'fresh') {
                    row.classList.add('fresh');
                } else if (warning.status === 'acceptable') {
                    row.classList.add('acceptable');
                } else {
                    row.classList.add('stale');
                }

                tbody.appendChild(row);
            });
        }

        function updateSystemStatus() {
            // Update bridge status
            const bridgeStatus = document.getElementById('bridgeStatus');
            bridgeStatus.textContent = 'Bridge: Active (simulated)';

            // Update market status
            const marketStatus = document.getElementById('marketStatus');
            const usOpen = isMarketOpen('us');
            const hkOpen = isMarketOpen('hk');
            marketStatus.innerHTML = `US Market: ${usOpen ? 'Open' : 'Closed'} | HK Market: ${hkOpen ? 'Open' : 'Closed'}`;

            // Update last update time
            document.getElementById('lastUpdate').textContent = `Last Update: ${new Date().toLocaleString('zh-HK')}`;
        }

        // Auto-check every minute
        setInterval(checkPrices, 60000);

        // Initial check
        checkPrices();
    </script>
</body>
</html>
